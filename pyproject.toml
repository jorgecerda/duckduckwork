[project]
name = "duckduckwork"
version = "0.2.11"
description = "AI-powered end-to-end job search engine and CRM dashboard"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "jorgecerda"}]
keywords = ["job-search", "crm", "ai", "resume", "duckduckwork"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

dependencies = [
    "python-jobspy>=1.1.50",
    "typer>=0.9.0",
    "rich>=13.0",
    "httpx>=0.24",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pg8000>=1.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
duckduckwork = "applypilot.cli:app"
ddw = "applypilot.cli:app"
applypilot = "applypilot.cli:app"

[project.urls]
Homepage = "https://github.com/jorgecerda/duckduckwork"
Repository = "https://github.com/jorgecerda/duckduckwork"
Issues = "https://github.com/jorgecerda/duckduckwork/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applypilot"]

[tool.hatch.build]
artifacts = ["src/applypilot/config/*.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E402"]
